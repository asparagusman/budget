# Copied to /etc/nginx/conf.d/default.conf, which the image's own nginx.conf
# includes inside its http {} block.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. A literal `proxy_pass http://api:3001` resolves
  # `api` once, at startup, and keeps that IP for good — so recreating the
  # api container (`up -d api`, i.e. every deploy) leaves this proxying to an
  # address nothing answers on: 502 until web is restarted too. A proxy_pass
  # through a variable is resolved per request instead, cached for 10s.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # The api accepts 10 MB spreadsheet imports; nginx's default limit is 1 MB.
  client_max_body_size 11m;

  # Who the client really is. Every request reaches nginx through the host's
  # Caddy (budget.local -> 127.0.0.1:8080 -> Docker's bridge gateway), so
  # $remote_addr on its own is one address for everyone. Caddy sets
  # X-Forwarded-For to the address the browser connected from. Trusting that
  # header from private addresses is safe only because the port is published
  # on 127.0.0.1: nothing off this host can be the peer that sends it.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;

  # add_header is inherited all-or-nothing: a location that sets any header
  # of its own drops every one declared here. So each location below that
  # sets Cache-Control repeats these three. `always` puts them on 404s too.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "same-origin" always;
  # frame-ancestors only. A full CSP has to be audited against everything
  # the SPA loads, and a wrong one breaks the app without saying why.
  add_header Content-Security-Policy "frame-ancestors 'none'" always;

  location /api/ {
    # A proxy_pass with a variable sends the request URI as it stands — it
    # does NOT strip the location prefix the way `proxy_pass http://api:3001/`
    # did — so the rewrite strips /api. `break` keeps the request in this
    # location; the query string is carried across unchanged.
    set $api_upstream http://api:3001;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    # Set, never appended to: the api's rate limiter keys on the client
    # address, and an appended chain would let a client pick its own key.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Vite's content-hashed bundles: the bytes behind a given URL never change,
  # so they're cached for a year. A missing chunk must 404 — falling through
  # to index.html hands the browser HTML where it expects JavaScript, which
  # after a deploy shows up as a blank screen rather than an error.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
  }

  # The shell names the current bundles, so it is revalidated on every load;
  # otherwise a deploy goes unseen until a heuristic cache lapses.
  location = /index.html {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
  }

  # Client-side routes fall back to the shell, through the location above,
  # so they get its no-cache. Unhashed root files (favicon.svg) revalidate too.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
  }
}
