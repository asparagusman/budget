<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Two colours only, both from tokens.css: --accent's light value as the
    rounded tile, --surface's as the mark. An SVG favicon inherits nothing
    from the page, so these are literal — keep them in step with the tokens
    by hand if the accent ever moves.

    The mark is the allocation itself: one income bar splitting into three
    unequal destinations. Legible at 16px, which a currency glyph is not.
  -->
  <rect width="32" height="32" rx="7" fill="#3b6fd4" />
  <g fill="#ffffff">
    <rect x="7" y="7" width="18" height="4" rx="2" />
    <rect x="7" y="14" width="10" height="4" rx="2" fill-opacity="0.9" />
    <rect x="7" y="21" width="14" height="4" rx="2" fill-opacity="0.75" />
  </g>
</svg>
